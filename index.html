<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Metorion - Condições climáticas em tempo real para qualquer cidade do mundo">
    <meta name="theme-color" content="#1C0F12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Metorion">
    <link rel="apple-touch-icon" href="./img/metorion.png">
    <link rel="manifest" href="manifest.json">
    <title>Metorion</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="scripts.js" defer></script>
</head>

<body>
    <header class="logo-metorion">
        <img src="./img/metorion.png" alt="Metorion logo">
    </header>

    <div class="larger-box">
        <div class="search-row">
            <input
                class="input-city"
                id="input-city"
                placeholder="Digite o nome da cidade"
                type="text"
                aria-label="Nome da cidade"
            >
            <button class="search-button" id="search-button" aria-label="Buscar clima">
                <img src="./img/weather.png" alt="">
            </button>
        </div>

        <div class="weather-info">
            <h2 class="city">São Paulo</h2>
            <div class="weather-main">
                <p class="temp">21°C</p>
                <img class="img-climate" src="./img/icon-climate.png" alt="ícone do clima">
            </div>
            <p class="text-climate">Nublado</p>

            <div class="weather-details">
                <div class="detail-item">
                    <span class="detail-value humidity">60%</span>
                    <span class="detail-label">Umidade</span>
                </div>
                <div class="detail-item">
                    <span class="detail-value wind">2.04 km/h</span>
                    <span class="detail-label">Vento</span>
                </div>
            </div>
        </div>

        <p class="error-message" aria-live="polite"></p>
    </div>

    <footer>
        Desenvolvido por <span>Natanael Cristofe</span>
        <a class="git-hub" href="https://github.com/natanael731" title="Perfil no GitHub" target="_blank" rel="noopener noreferrer">
            <img class="git-icon" src="./img/git-hub-icon.png" alt="GitHub">
        </a>
    </footer>

</body>

</html>
